<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Outbound OS workflow illustration</title>
  <desc id="desc">A publisher CSV moves through qualification, a three-publisher smoke review, and a complete action review before producing Gmail draft intents or local manual follow-up records. A safety rail states that the workflow never sends, schedules, submits forms, or exports to a CRM.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111d"/>
      <stop offset="1" stop-color="#10263a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183047"/>
      <stop offset="1" stop-color="#112338"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#02070d" flood-opacity="0.42"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#35516b" stroke-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1600" height="720" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="720" rx="32" fill="url(#grid)"/>
  <circle cx="1450" cy="-40" r="270" fill="#25c489" opacity="0.06"/>
  <circle cx="90" cy="720" r="240" fill="#f4b94f" opacity="0.06"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="88" y="96" fill="#7ee2b8" font-size="18" font-weight="700" letter-spacing="4">CONTROLLED PUBLISHER OUTREACH</text>
    <text x="88" y="160" fill="#f3f7fb" font-size="62" font-weight="750">Outbound OS</text>
    <text x="88" y="205" fill="#b9cad8" font-size="24">From publisher CSV to review-ready campaign state—through two human gates.</text>

    <g transform="translate(88 270)" filter="url(#shadow)">
      <rect width="252" height="244" rx="20" fill="url(#panel)" stroke="#31536d"/>
      <rect x="22" y="22" width="92" height="30" rx="15" fill="#223e55"/>
      <text x="68" y="43" fill="#b9cad8" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.4">INPUT</text>
      <text x="24" y="92" fill="#f3f7fb" font-size="24" font-weight="700">Publisher CSV</text>
      <g transform="translate(24 118)">
        <rect width="204" height="28" rx="7" fill="#0d1c2c"/>
        <circle cx="16" cy="14" r="5" fill="#7ee2b8"/>
        <text x="30" y="19" fill="#c8d6e2" font-size="14">domain + traffic</text>
        <rect y="38" width="204" height="28" rx="7" fill="#0d1c2c"/>
        <circle cx="16" cy="52" r="5" fill="#7ee2b8"/>
        <text x="30" y="57" fill="#c8d6e2" font-size="14">SSP / ad manager</text>
        <rect y="76" width="204" height="28" rx="7" fill="#0d1c2c"/>
        <circle cx="16" cy="90" r="5" fill="#7ee2b8"/>
        <text x="30" y="95" fill="#c8d6e2" font-size="14">target criteria</text>
      </g>
    </g>

    <path d="M362 392H426" stroke="#557089" stroke-width="3" stroke-linecap="round"/>
    <path d="M416 384L428 392 416 400" fill="none" stroke="#557089" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(450 270)" filter="url(#shadow)">
      <rect width="250" height="244" rx="20" fill="url(#panel)" stroke="#31536d"/>
      <rect x="22" y="22" width="110" height="30" rx="15" fill="#183f38"/>
      <text x="77" y="43" fill="#7ee2b8" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.4">PREPARE</text>
      <text x="24" y="92" fill="#f3f7fb" font-size="24" font-weight="700">Campaign graph</text>
      <g transform="translate(28 114)" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 18H90L120 58H184" stroke="#557089" stroke-width="3"/>
        <path d="M24 94H90L120 58" stroke="#557089" stroke-width="3"/>
        <circle cx="24" cy="18" r="12" fill="#14283c" stroke="#7ee2b8" stroke-width="3"/>
        <circle cx="24" cy="94" r="12" fill="#14283c" stroke="#7ee2b8" stroke-width="3"/>
        <circle cx="120" cy="58" r="14" fill="#14283c" stroke="#f4b94f" stroke-width="3"/>
        <circle cx="184" cy="58" r="12" fill="#14283c" stroke="#7ee2b8" stroke-width="3"/>
        <text x="24" y="116" fill="#b9cad8" stroke="none" font-size="12" text-anchor="middle">filter</text>
        <text x="120" y="116" fill="#b9cad8" stroke="none" font-size="12" text-anchor="middle">merge</text>
        <text x="184" y="116" fill="#b9cad8" stroke="none" font-size="12" text-anchor="middle">research</text>
      </g>
    </g>

    <path d="M722 392H772" stroke="#557089" stroke-width="3" stroke-linecap="round"/>
    <path d="M762 384L774 392 762 400" fill="none" stroke="#557089" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(796 246)" filter="url(#shadow)">
      <rect width="246" height="292" rx="22" fill="#182d3e" stroke="#f4b94f" stroke-width="2"/>
      <rect x="22" y="22" width="94" height="30" rx="15" fill="#493b22"/>
      <text x="69" y="43" fill="#ffd27e" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.4">GATE 01</text>
      <text x="24" y="94" fill="#f3f7fb" font-size="24" font-weight="700">Smoke review</text>
      <text x="24" y="122" fill="#b9cad8" font-size="15">Three varied publishers</text>
      <g transform="translate(24 140)">
        <rect width="198" height="32" rx="9" fill="#0e1d2c" stroke="#31536d"/>
        <circle cx="18" cy="16" r="7" fill="#7ee2b8"/>
        <rect x="34" y="9" width="92" height="7" rx="3.5" fill="#d8e3eb"/>
        <rect x="34" y="21" width="134" height="5" rx="2.5" fill="#557089"/>
        <rect y="42" width="198" height="32" rx="9" fill="#0e1d2c" stroke="#31536d"/>
        <circle cx="18" cy="58" r="7" fill="#7ee2b8"/>
        <rect x="34" y="51" width="78" height="7" rx="3.5" fill="#d8e3eb"/>
        <rect x="34" y="63" width="146" height="5" rx="2.5" fill="#557089"/>
        <rect y="84" width="198" height="32" rx="9" fill="#0e1d2c" stroke="#31536d"/>
        <circle cx="18" cy="100" r="7" fill="#7ee2b8"/>
        <rect x="34" y="93" width="106" height="7" rx="3.5" fill="#d8e3eb"/>
        <rect x="34" y="105" width="124" height="5" rx="2.5" fill="#557089"/>
      </g>
      <text x="24" y="276" fill="#ffd27e" font-size="13" font-weight="700">CALIBRATE BEFORE SCALE</text>
    </g>

    <path d="M1064 392H1114" stroke="#557089" stroke-width="3" stroke-linecap="round"/>
    <path d="M1104 384L1116 392 1104 400" fill="none" stroke="#557089" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(1138 246)" filter="url(#shadow)">
      <rect width="374" height="292" rx="22" fill="#182d3e" stroke="#f4b94f" stroke-width="2"/>
      <rect x="22" y="22" width="94" height="30" rx="15" fill="#493b22"/>
      <text x="69" y="43" fill="#ffd27e" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.4">GATE 02</text>
      <text x="24" y="94" fill="#f3f7fb" font-size="24" font-weight="700">Complete action review</text>
      <text x="24" y="122" fill="#b9cad8" font-size="15">Every account · exact copy · proposed route</text>
      <g transform="translate(24 144)">
        <rect width="326" height="52" rx="10" fill="#0e1d2c" stroke="#31536d"/>
        <text x="16" y="21" fill="#f3f7fb" font-size="14" font-weight="700">Publisher account</text>
        <text x="16" y="40" fill="#8fa7b9" font-size="12">evidence · history · route</text>
        <rect x="218" y="11" width="92" height="30" rx="8" fill="#174c3c"/>
        <text x="264" y="31" fill="#8ff0c4" font-size="12" font-weight="700" text-anchor="middle">REVIEW</text>
        <rect y="64" width="156" height="44" rx="10" fill="#143527" stroke="#2e7d5a"/>
        <text x="78" y="82" fill="#8ff0c4" font-size="12" font-weight="700" text-anchor="middle">GMAIL DRAFT</text>
        <text x="78" y="98" fill="#8fa7b9" font-size="10" text-anchor="middle">intent + receipt</text>
        <rect x="170" y="64" width="156" height="44" rx="10" fill="#263245" stroke="#557089"/>
        <text x="248" y="82" fill="#d8e3eb" font-size="12" font-weight="700" text-anchor="middle">MANUAL ROUTE</text>
        <text x="248" y="98" fill="#8fa7b9" font-size="10" text-anchor="middle">local follow-up</text>
      </g>
      <text x="24" y="276" fill="#ffd27e" font-size="13" font-weight="700">APPROVE ONLY THE SHOWN ACTION</text>
    </g>

    <g transform="translate(88 590)">
      <rect width="1424" height="72" rx="16" fill="#2b1820" stroke="#9b4254"/>
      <rect x="18" y="18" width="130" height="36" rx="9" fill="#572331"/>
      <text x="83" y="42" fill="#ff9bad" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1.5">SAFETY RAIL</text>
      <text x="182" y="43" fill="#f8dce2" font-size="18" font-weight="650">NO SEND</text>
      <circle cx="306" cy="36" r="3" fill="#9b4254"/>
      <text x="332" y="43" fill="#f8dce2" font-size="18" font-weight="650">NO SCHEDULE</text>
      <circle cx="494" cy="36" r="3" fill="#9b4254"/>
      <text x="520" y="43" fill="#f8dce2" font-size="18" font-weight="650">NO FORM SUBMIT</text>
      <circle cx="720" cy="36" r="3" fill="#9b4254"/>
      <text x="746" y="43" fill="#f8dce2" font-size="18" font-weight="650">NO CRM EXPORT</text>
      <text x="1376" y="43" fill="#c98b98" font-size="14" text-anchor="end">documented workflow boundary</text>
    </g>
  </g>
</svg>
