<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
  <title id="title">Outbound OS complete-review contract illustration</title>
  <desc id="desc">Three illustrative publisher records demonstrate what the documented full-review contract is designed to surface: evidence, source traffic estimate, Gmail history state, proposed route, exact-copy status, and one item-level decision. The image is not a screenshot of a running interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f7f6"/>
      <stop offset="1" stop-color="#e6eeef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#27445a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1440" height="650" rx="28" fill="url(#bg)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="64" y="70" fill="#10263a" font-size="27" font-weight="760">Complete review contract</text>
    <text x="64" y="104" fill="#557084" font-size="17">Every canonical account remains visible—including held, excluded, failed, and non-actionable outcomes.</text>
    <rect x="1118" y="48" width="258" height="48" rx="12" fill="#fff1cf" stroke="#e5b352"/>
    <text x="1247" y="78" fill="#6e5015" font-size="14" font-weight="750" text-anchor="middle">ILLUSTRATION · NOT UI CAPTURE</text>

    <g transform="translate(64 146)" filter="url(#shadow)">
      <rect width="408" height="394" rx="20" fill="#ffffff" stroke="#c9d8df"/>
      <rect width="408" height="62" rx="20" fill="#10263a"/>
      <path d="M0 42H408V62H0Z" fill="#10263a"/>
      <circle cx="30" cy="31" r="10" fill="#7ee2b8"/>
      <text x="52" y="38" fill="#f3f7fb" font-size="19" font-weight="720">Publisher record A</text>
      <text x="28" y="100" fill="#557084" font-size="12" font-weight="750" letter-spacing="1.2">EVIDENCE-GROUNDED DESCRIPTION</text>
      <rect x="28" y="116" width="352" height="9" rx="4.5" fill="#c9d8df"/>
      <rect x="28" y="134" width="280" height="9" rx="4.5" fill="#dce6ea"/>
      <g transform="translate(28 168)">
        <rect width="168" height="64" rx="12" fill="#edf5f1"/>
        <text x="14" y="24" fill="#557084" font-size="11" font-weight="700">SOURCE ESTIMATE</text>
        <text x="14" y="49" fill="#183b30" font-size="18" font-weight="750">125k pageviews</text>
        <rect x="184" width="168" height="64" rx="12" fill="#eef2f7"/>
        <text x="198" y="24" fill="#557084" font-size="11" font-weight="700">GMAIL HISTORY</text>
        <text x="198" y="49" fill="#234863" font-size="18" font-weight="750">Clear</text>
      </g>
      <text x="28" y="268" fill="#557084" font-size="11" font-weight="700">PROPOSED ACTION</text>
      <text x="28" y="294" fill="#10263a" font-size="17" font-weight="720">Create exact Gmail draft</text>
      <rect x="28" y="320" width="218" height="48" rx="11" fill="#176e50"/>
      <text x="137" y="350" fill="#ffffff" font-size="14" font-weight="740" text-anchor="middle">APPROVE SHOWN ACTION</text>
      <rect x="258" y="320" width="122" height="48" rx="11" fill="#ffffff" stroke="#b7c8d1"/>
      <text x="319" y="350" fill="#496375" font-size="14" font-weight="700" text-anchor="middle">EXCLUDE</text>
    </g>

    <g transform="translate(516 146)" filter="url(#shadow)">
      <rect width="408" height="394" rx="20" fill="#ffffff" stroke="#c9d8df"/>
      <rect width="408" height="62" rx="20" fill="#10263a"/>
      <path d="M0 42H408V62H0Z" fill="#10263a"/>
      <circle cx="30" cy="31" r="10" fill="#f4b94f"/>
      <text x="52" y="38" fill="#f3f7fb" font-size="19" font-weight="720">Publisher record B</text>
      <text x="28" y="100" fill="#557084" font-size="12" font-weight="750" letter-spacing="1.2">VERIFIED GROUP CONTEXT</text>
      <rect x="28" y="116" width="352" height="9" rx="4.5" fill="#c9d8df"/>
      <rect x="28" y="134" width="248" height="9" rx="4.5" fill="#dce6ea"/>
      <g transform="translate(28 168)">
        <rect width="168" height="64" rx="12" fill="#fff6e5"/>
        <text x="14" y="24" fill="#6e5015" font-size="11" font-weight="700">SITE ESTIMATE</text>
        <text x="14" y="49" fill="#6e5015" font-size="18" font-weight="750">84k pageviews</text>
        <rect x="184" width="168" height="64" rx="12" fill="#fff6e5"/>
        <text x="198" y="24" fill="#6e5015" font-size="11" font-weight="700">GROUP ESTIMATE</text>
        <text x="198" y="49" fill="#6e5015" font-size="18" font-weight="750">212k pageviews</text>
      </g>
      <text x="28" y="268" fill="#557084" font-size="11" font-weight="700">PROPOSED ACTION</text>
      <text x="28" y="294" fill="#10263a" font-size="17" font-weight="720">Add to manual follow-up list</text>
      <rect x="28" y="320" width="218" height="48" rx="11" fill="#176e50"/>
      <text x="137" y="350" fill="#ffffff" font-size="14" font-weight="740" text-anchor="middle">APPROVE SHOWN ACTION</text>
      <rect x="258" y="320" width="122" height="48" rx="11" fill="#ffffff" stroke="#b7c8d1"/>
      <text x="319" y="350" fill="#496375" font-size="14" font-weight="700" text-anchor="middle">EXCLUDE</text>
    </g>

    <g transform="translate(968 146)" filter="url(#shadow)">
      <rect width="408" height="394" rx="20" fill="#ffffff" stroke="#c9d8df"/>
      <rect width="408" height="62" rx="20" fill="#10263a"/>
      <path d="M0 42H408V62H0Z" fill="#10263a"/>
      <circle cx="30" cy="31" r="10" fill="#ff9bad"/>
      <text x="52" y="38" fill="#f3f7fb" font-size="19" font-weight="720">Publisher record C</text>
      <text x="28" y="100" fill="#557084" font-size="12" font-weight="750" letter-spacing="1.2">EXPLICIT NO-ACTION OUTCOME</text>
      <rect x="28" y="116" width="352" height="9" rx="4.5" fill="#c9d8df"/>
      <rect x="28" y="134" width="304" height="9" rx="4.5" fill="#dce6ea"/>
      <g transform="translate(28 168)">
        <rect width="168" height="64" rx="12" fill="#f8ecef"/>
        <text x="14" y="24" fill="#7c3947" font-size="11" font-weight="700">DISPOSITION</text>
        <text x="14" y="49" fill="#7c3947" font-size="18" font-weight="750">Suppressed</text>
        <rect x="184" width="168" height="64" rx="12" fill="#eef2f7"/>
        <text x="198" y="24" fill="#557084" font-size="11" font-weight="700">ACTION</text>
        <text x="198" y="49" fill="#234863" font-size="18" font-weight="750">None</text>
      </g>
      <text x="28" y="268" fill="#557084" font-size="11" font-weight="700">REASON RETAINED</text>
      <text x="28" y="294" fill="#10263a" font-size="17" font-weight="720">Prior conversation found</text>
      <rect x="28" y="320" width="352" height="48" rx="11" fill="#f5f7f8" stroke="#c9d8df"/>
      <text x="204" y="350" fill="#496375" font-size="14" font-weight="700" text-anchor="middle">VISIBLE IN THE COMPLETE REVIEW</text>
    </g>

    <g transform="translate(64 574)">
      <rect width="1312" height="42" rx="10" fill="#2b1820"/>
      <text x="656" y="27" fill="#f8dce2" font-size="14" font-weight="700" text-anchor="middle">Approval is item-level: draft or local follow-up record only · never send · never submit</text>
    </g>
  </g>
</svg>
